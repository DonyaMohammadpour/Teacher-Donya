{% extends "base.html" %}{% block content %}<section class="card narrow"><h1>ویرایش جلسه</h1><form method="post"><label>تاریخ شمسی<input name="lesson_date" value="{{jalali}}" required></label><label>ساعت شروع<input type="time" name="start_time" value="{{lesson.start_time}}" required></label><label>مدت کلاس (دقیقه)<select name="duration_minutes">{% for m in [45,60,75,90,120] %}<option value="{{m}}" {% if lesson.duration_minutes==m %}selected{% endif %}>{{m}} دقیقه</option>{% endfor %}</select></label><label>موضوع<input name="topic" value="{{lesson.topic}}"></label><label>تکلیف<input name="homework" value="{{lesson.homework}}"></label><label>وضعیت<select name="status">{% for s in ['برنامه‌ریزی‌شده','برگزار شد','غایب','لغو شد','جلسه جبرانی'] %}<option {% if lesson.status==s %}selected{% endif %}>{{s}}</option>{% endfor %}</select></label><button>ذخیره تغییرات</button><a href="{{url_for('student_detail',student_id=lesson.student_id)}}">بازگشت</a></form></section>{% endblock %}
