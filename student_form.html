{% extends "base.html" %}{% block content %}<section class="card"><h1>افزودن زبان‌آموز</h1><form method="post" class="form-grid">
<label>نام و نام خانوادگی<input name="name" required></label><label>نام کاربری ورود<input name="username" required></label><label>رمز اولیه (حداقل ۸ کاراکتر)<input name="password" type="password" minlength="8" required></label><label>شماره تماس<input name="phone" placeholder="0912xxxxxxx"></label><label class="wide check-label"><input type="checkbox" name="sms_consent"> زبان‌آموز با دریافت پیامک یادآوری موافقت کرده است.</label>
<label>سطح زبان<input name="level" placeholder="مثلاً B1"></label><label>نوع کلاس<input name="class_type" value="خصوصی"></label><label class="wide">هدف آموزشی<input name="goal"></label><label class="wide">روز و ساعت کلاس<input name="schedule_note"></label>
<label>نوع محاسبه شهریه<select name="billing_mode"><option value="session">جلسه‌ای</option><option value="course">دوره‌ای</option></select></label><label>هزینه هر جلسه (برای جلسه‌ای)<input type="number" name="session_fee" min="0" value="0"></label><label>تعداد جلسات دوره<input type="number" name="package_sessions" min="1" value="8"></label><label>مبلغ کل دوره (برای دوره‌ای)<input type="number" name="package_price" min="0" value="0"></label>
<div class="wide"><button>ساخت پرونده</button></div></form></section>{% endblock %}
